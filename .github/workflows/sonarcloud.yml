name: SonarCloud Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # SonarScanner 4.8.1 requiere JDK 17; el action oficial traía imagen con Java 11.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download SonarScanner
        run: |
          curl -fsSL https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.1.3023-linux.zip -o sonar-scanner.zip
          unzip -q sonar-scanner.zip

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./sonar-scanner-4.8.1.3023-linux/bin/sonar-scanner -Dsonar.sonarcloud.url=https://sonarcloud.io