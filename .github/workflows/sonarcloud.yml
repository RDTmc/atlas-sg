name: SonarCloud Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java version
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          which java
          java -version

      - name: Download SonarScanner
        run: |
          curl -fsSL https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.1.3023-linux.zip -o sonar-scanner.zip
          unzip -q sonar-scanner.zip

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # El script del scanner fuerza su propio JRE embebido (Java 11) ignorando JAVA_HOME/PATH.
          # Desactivamos ese JRE para que use el Java 21 del runner (el scanner requiere Java 17+).
          sed -i 's/use_embedded_jre=true/use_embedded_jre=false/' sonar-scanner-4.8.1.3023-linux/bin/sonar-scanner
          ./sonar-scanner-4.8.1.3023-linux/bin/sonar-scanner -Dsonar.login="$SONAR_TOKEN"