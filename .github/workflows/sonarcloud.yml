name: SonarCloud Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonar:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.21-9/x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download SonarScanner
        run: |
          curl -fsSL https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.1.3023-linux.zip -o sonar-scanner.zip
          unzip -q sonar-scanner.zip

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sed -i 's/use_embedded_jre=true/use_embedded_jre=false/' sonar-scanner-4.8.1.3023-linux/bin/sonar-scanner
          ./sonar-scanner-4.8.1.3023-linux/bin/sonar-scanner -Dsonar.login=$SONAR_TOKEN